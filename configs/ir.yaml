# Fresh LoRA training on SD-Turbo; restoration weights are used only for testing.
name: SDIR
model_type: SDIR_Model
scale: 1
is_train: true

# Match the tested architecture, without loading its trained tensors.
model_options:
  lora_rank_unet_deg: 72
  lora_rank_vae_deg: 52
  lora_rank_unet_vq: 8
  lora_rank_vae_vq: 4
  selector_rank_unet: 64
  selector_rank_vae: 48

datasets:
  train:
    name: TrainSet
    type: IRTrainDataset
    mode: train
    dataroot: /path/to/datasets/all_in_one/train
    de_type: [denoise, derain, dehaze, delowlight, deblur, desnow, deraindrop, deshadow, dejpeg, inpaint]
    patch_size: 256
    data_augmentation: 2
    scale: 1
    label_smooth: 0.1
    use_shuffle: false
  val:
    name: ValSet
    type: IRTestDataset
    mode: val
    dataroot: /path/to/datasets/all_in_one/val
    num_degra: 10
    batch_size_per_gpu: 1

train_options:
  # Initial patch/batch/lr/accumulation: user-confirmed 256/16/1e-4/1.
  # Remaining defaults follow IRDiff_ten_deg_tile_new3; fresh adapters as requested.
  # SSIM uses lambda_lpips; the vq phase uses pixel L1 with lambda_l1.
  output_dir: training_output
  pretrained_path: null
  sd_path: /path/to/pretrained/sd-turbo
  daclip_path: /path/to/pretrained/daclip_ViT-B-32.pt
  vgg_path: /path/to/pretrained/vgg16-397923af.pth
  clip_path: /path/to/pretrained/ViT-B-32.pt
  lpips_path: /path/to/pretrained/lpips_vgg_v0.1.pth
  train_batch_size: 16
  max_train_steps: 200000
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  enable_xformers_memory_efficient_attention: true
  dataloader_num_workers: 0
  seed: null
  learning_rate: 0.0001
  lr_scheduler: cosine
  lr_warmup_steps: -1
  lr_num_cycles: 1
  lr_power: 0.1
  mixed_precision: null  # Follow Accelerate / ACCELERATE_MIXED_PRECISION; default: no.
  checkpointing_steps: 500
  eval_freq: 100
  validation_mode: deg_vq
  lambda_l1: 2.0
  lambda_lpips: 5.0
  lambda_cls: 0.5
  lambda_contra: 1.0
  use_contrastive_loss: false  # Original loss_contra is commented out.
  lambda_gan: 0.3

test_options:
  output_dir: outputs
  pretrained_path: /path/to/checkpoints/ir_model.pkl
  use_vq: true
  sd_path: /path/to/pretrained/sd-turbo
  daclip_path: /path/to/pretrained/daclip_ViT-B-32.pt
  mixed_precision: "no"
  tile_size: 512
  tile_overlap: 128
  seed: 42
